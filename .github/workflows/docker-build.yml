name: Docker Build and Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  docker-build-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create test model structure
      run: |
        mkdir -p model
        # Create minimal test model files
        cat > model/manifest.json << 'EOF'
        {
          "model_name": "test.model",
          "model_version": "1",
          "model_alias": "champion",
          "source_run_id": "test-run-123",
          "files": [
            {"path": "MLmodel", "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},
            {"path": "model.pkl", "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}
          ]
        }
        EOF
        
        cat > model/MLmodel << 'EOF'
        flavors:
          python_function:
            env:
              conda: conda.yaml
              virtualenv: python_env.yaml
            loader_module: mlflow.sklearn
            model_path: model.pkl
            python_version: "3.12"
        artifacts:
          model.pkl: {}
        EOF
        
        touch model/model.pkl
        mkdir -p serving
        cp app.py serving/
        cp requirements-api.txt serving/
    
    - name: Build Docker image
      run: |
        docker build -f Dockerfile . -t sentiment-api:test
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'sentiment-api:test'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run container and test API
      run: |
        # Start container in background
        docker run -d --name sentiment-test -p 8000:8000 sentiment-api:test
        
        # Wait for container to start
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:8000/health || echo "Health check failed"
        
        # Test predict endpoint
        curl -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"texts": ["test positive", "test negative"]}' \
          --max-time 30 || echo "Predict test failed"
        
        # Stop container
        docker stop sentiment-test
        docker rm sentiment-test
    
    - name: Docker Scout quickview
      uses: docker/scout-action@v1
      with:
        command: quickview
        image: sentiment-api:test
    
    - name: Save Docker image as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: |
          docker-image.tar
        retention-days: 7