bundle:
  name: mlops-sentiment

variables:
  model_name:
    default: project1.mlops_sentiment.sentiment_classifier
  config_name:
    default: gate_v5.json
  notification_email:
    default: zeenatriaz468@gmail.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://databricks.com
  integration_test:
    mode: development
    workspace:
      host: https://databricks.com
    variables:
      model_name: project1.mlops_sentiment.sentiment_classifier_test
      config_name: gate_test.json

resources:
  jobs:
    retrain_sentiment:
      name: retrain-sentiment-${bundle.target}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
            dependencies:
              - pytest
      tasks:
        - task_key: unit_tests
          spark_python_task:
            python_file: ./src/00_unit_tests.py
          environment_key: Default
        - task_key: validate_data
          depends_on:
            - task_key: unit_tests
          spark_python_task:
            python_file: ./src/01_validate_data.py
            parameters: ["--model", "${var.model_name}", "--config-name", "${var.config_name}"]
          environment_key: Default
        - task_key: train
          depends_on:
            - task_key: validate_data
          spark_python_task:
            python_file: ./src/02_train.py
            parameters: ["--model", "${var.model_name}", "--config-name", "${var.config_name}"]
          environment_key: Default
        - task_key: gate
          depends_on:
            - task_key: train
          spark_python_task:
            python_file: ./src/03_gate.py
            parameters: ["--model", "${var.model_name}", "--config-name", "${var.config_name}"]
          environment_key: Default
        - task_key: gate_check
          depends_on:
            - task_key: gate
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.gate.values.gate_passed}}"
            right: "true"
        - task_key: register
          depends_on:
            - task_key: gate_check
              outcome: "true"
          spark_python_task:
            python_file: ./src/04_register.py
            parameters: ["--model", "${var.model_name}", "--config-name", "${var.config_name}"]
          environment_key: Default

    promote_sentiment:
      name: promote-sentiment-${bundle.target}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      tasks:
        - task_key: promote
          spark_python_task:
            python_file: ./src/05_promote.py
            parameters: ["--model", "${var.model_name}", "--metric", "gate_tweet_acc", "--min-improvement", "0.005"]
          environment_key: Default
