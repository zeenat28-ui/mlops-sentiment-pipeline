name: Docker Build and Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  docker-build-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Verify model and serving files
      run: |
        test -f serving/app.py || (echo "serving/app.py missing" && exit 1)
        test -f serving/requirements-api.txt || (echo "serving/requirements-api.txt missing" && exit 1)
        test -f model/manifest.json || (echo "model/manifest.json missing" && exit 1)
        test -f model/model.pkl || (echo "model/model.pkl missing" && exit 1)
        echo "All model and serving files verified."
    
    - name: Build Docker image
      run: |
        docker build -f Dockerfile . -t sentiment-api:test
    
    - name: Run container and test API
      run: |
        # Start container in background
        docker run -d --name sentiment-test -p 8000:8000 sentiment-api:test
        
        # Wait for container and model lifespan to initialize
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:8000/health
        
        # Test predict endpoint with real text
        curl -f -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"texts": ["Great movie loved it", "Terrible waste of time"]}'
        
        # Check container logs
        docker logs sentiment-test
        
        # Stop and remove container
        docker stop sentiment-test
        docker rm sentiment-test
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: 'sentiment-api:test'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Check Trivy output
      id: check-trivy
      run: |
        if [ -s trivy-results.sarif ]; then
          echo "sarif_exists=true" >> $GITHUB_OUTPUT
        else
          echo "sarif_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: steps.check-trivy.outputs.sarif_exists == 'true'
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Save Docker image artifact
      run: |
        docker save sentiment-api:test -o docker-image.tar
    
    - name: Upload Docker image as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: docker-image.tar
        retention-days: 7
